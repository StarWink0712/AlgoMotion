name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npm run test:e2e -- --grep-invert 'mobile|390px'
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux'
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  reference-code:
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run test:references

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sandbox:build
      - run: npm run test:sandbox
      # No paid model credentials in CI; test:live is an explicit local opt-in.
